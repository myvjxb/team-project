<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична 1 — Клієнт</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            background-color: #9A26F1;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #7d1bc7;
        }
        ul {
            margin-top: 20px;
            padding-left: 0;
            list-style: none;
        }
        li {
            background: #1e1e1e;
            margin-bottom: 8px;
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 4px solid #9A26F1;
        }
    </style>
</head>
<body>

    <h2>Список елементів з БД</h2>
    <button id="loadBtn">Load items</button>
    <ul id="itemsList"></ul>

    <script>
        document.getElementById('loadBtn').addEventListener('click', async () => {
            const list = document.getElementById('itemsList');
            list.innerHTML = '<li>Завантаження...</li>';

            try {
                const response = await fetch('http://localhost:3000/items');
                const items = await response.json();

                list.innerHTML = '';
                items.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = `#${item.id} —${item.name}`;
                    list.appendChild(li);
                });
            } catch (error) {
                list.innerHTML = '<li style="border-color: #ff4d4d;">Помилка підключення до сервера</li>';
                console.error(error);
            }
        });
    </script>

</body>
</html>
